<!--
  React, ReactDOM y Babel NO se cargan aquí con <script src> fijos.
  Se cargan más abajo con un pequeño loader que prueba varias CDNs (unpkg y
  jsDelivr) y con reintentos, y el código de la app SOLO se ejecuta una vez
  confirmado que React/ReactDOM/Babel están disponibles. Así, si una CDN
  falla o está bloqueada, no se produce "ReferenceError: React is not
  defined": se reintenta con otra fuente o se muestra un aviso claro.
  Los iconos ya no dependen de ninguna CDN: están definidos como SVG dentro
  del propio archivo (ver el componente Icon al inicio del bloque de la app).
-->

<style>
  html, body { margin: 0; padding: 0; background: #FFFFFF; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<!--
  Red de seguridad: si algo falla al cargar (un script CDN que no responde,
  un error de sintaxis, un error en tiempo de ejecución de React, etc.),
  esto muestra el error EN PANTALLA en vez de dejar la típica pantalla en
  blanco silenciosa. El error real siempre estaba en la consola (F12), pero
  ahora no hace falta abrirla.
-->
<script>
  function gremioShowFatalError(err) {
    var root = document.getElementById("root");
    if (!root) return;
    var msg = (err && err.stack) ? err.stack : (err && err.message) ? err.message : String(err);
    root.innerHTML =
      '<div style="font-family:ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;' +
      'padding:24px;color:#7F1D1D;background:#FEF2F2;min-height:100vh;font-size:13px;line-height:1.5;box-sizing:border-box;">' +
      '<div style="font-weight:800;font-size:15px;margin-bottom:10px;">⚠️ Ha fallado la carga de la app</div>' +
      '<div>' + String(msg).replace(/&/g, "&amp;").replace(/</g, "&lt;") + '</div>' +
      '<div style="margin-top:16px;font-size:11px;color:#991B1B;">Comparte este mensaje para poder arreglarlo.</div>' +
      '</div>';
  }
  window.addEventListener("error", function (e) { gremioShowFatalError(e.error || e.message); });
  window.addEventListener("unhandledrejection", function (e) { gremioShowFatalError(e.reason); });
</script>

      fill={fill}
      stroke={color}
      strokeWidth={strokeWidth}

      className={className}
      style={style}

    </svg>
  );
}

// ---- Almacenamiento: ya NO se usa localStorage. Todos los datos viven en
// un backend real y compartido (Netlify Functions + Netlify Blobs), así que
// cualquier visitante, desde cualquier dispositivo, ve la misma información. ----
async function apiGet(path) {
  const res = await fetch(path, { cache: "no-store" });
  if (!res.ok) throw new Error(`Error ${res.status} al cargar ${path}`);
  return res.json();
}
async function apiPost(path, body) {
  const res = await fetch(path, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Error ${res.status} al llamar a ${path}`);
  return data;
}

async function fetchProfessionals() {
  try {
    return await apiGet("/.netlify/functions/professionals");
  } catch {
    return [];
  }
}
async function fetchProfessionalById(id) {
  return apiGet(`/.netlify/functions/professionals?id=${encodeURIComponent(id)}`);
}
async function uploadPhoto(dataUrl) {
  const data = await apiPost("/.netlify/functions/photos", { dataUrl });
  return data.url;
}
async function reportProfessional(id, reason) {
  return apiPost("/.netlify/functions/professionals", { action: "report", id, reason });
}

async function createProfessional(form) {
  return apiPost("/.netlify/functions/professionals", { action: "create", ...form });
}
async function cancelProfessional(id, password, canceled) {
  return apiPost("/.netlify/functions/professionals", { action: "cancel", id, password, canceled });
}
async function lookupMyProfessionals(phone, password) {
  return apiPost("/.netlify/functions/professionals", { action: "lookup", phone, password });
}
async function updateProfessional(id, password, updates) {
  return apiPost("/.netlify/functions/professionals", { action: "update", id, password, ...updates });
}
async function fetchReviews() {
  try {
    return await apiGet("/.netlify/functions/reviews");
  } catch {
    return [];
  }
}
async function createReview(review) {
  return apiPost("/.netlify/functions/reviews", review);
}

function catInfo(id) {
  return CATEGORIES.find((c) => c.id === id) || CATEGORIES[0];
}

function daysLeft(trialEndsAt) {
  return Math.ceil((trialEndsAt - Date.now()) / 86400000);
}

function waNumber(phone) {
  let digits = (phone || "").replace(/[^\d]/g, "");
  if (digits.startsWith("0034")) digits = digits.slice(2);
  if (digits.length === 9) digits = "34" + digits;
  return digits;
}

// Compara texto ignorando tildes, mayúsculas y espacios sobrantes, para que
// "malaga", "Málaga" y "MÁLAGA " se traten como lo mismo en cualquier
// búsqueda o filtro de la web.
// Google Tag Manager: solo se carga si el usuario ha aceptado las cookies
// de análisis. Nunca se carga por defecto — eso es lo que exige la
// normativa (RGPD/LSSICE) para cookies no esenciales.
const GTM_ID = "GTM-MNPRJ88G";
function loadGTM() {
  if (window.__gtmLoaded) return;
  window.__gtmLoaded = true;
  (function (w, d, s, l, i) {
    w[l] = w[l] || [];
    w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
    var f = d.getElementsByTagName(s)[0],
      j = d.createElement(s),
      dl = l != "dataLayer" ? "&l=" + l : "";
    j.async = true;
    j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
    f.parentNode.insertBefore(j, f);
  })(window, document, "script", "dataLayer", GTM_ID);

  var ns = document.createElement("noscript");
  var iframe = document.createElement("iframe");
  iframe.src = "https://www.googletagmanager.com/ns.html?id=" + GTM_ID;
  iframe.height = "0";
  iframe.width = "0";
  iframe.style.display = "none";
  iframe.style.visibility = "hidden";
  ns.appendChild(iframe);
  document.body.appendChild(ns);
}

  useEffect(() => {

            Más info

}

function normalizeText(s) {
  return String(s || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .trim();
}

// Muestra el precio orientativo con el símbolo € aunque el profesional haya
// escrito solo el número (ej. "25" -> "25€", "desde 25" -> "desde 25€").
// Si ya escribió el símbolo, o si no hay ningún número (ej. "presupuesto
// gratis"), se deja tal cual, sin forzar nada raro.
function displayPrice(price) {
  const p = String(price || "").trim();
  if (!p || p.includes("€") || !/\d/.test(p)) return p;
  return `${p}€`;
}

function waLink(pro, extra) {
  const msg = `Hola, te he visto en Gremio. Necesito un presupuesto para ${catInfo(pro.category).label.toLowerCase()} en ${pro.zone}.${extra ? ` ${extra}` : ""}`;
  return `https://wa.me/${waNumber(pro.phone)}?text=${encodeURIComponent(msg)}`;
}

function avgRating(reviews) {
  if (!reviews.length) return 0;
  return reviews.reduce((s, r) => s + r.rating, 0) / reviews.length;
}

function readFileAsDataUrl(file, maxBytes, maxDimension = 1000, quality = 0.82) {
  return new Promise((resolve, reject) => {
    if (file.size > maxBytes) {
      reject(new Error(`La imagen pesa demasiado (máx. ${Math.round(maxBytes / 1000)} KB).`));
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        // Redimensiona al vuelo (máx. 1000px de lado) y comprime a JPEG:
        // así el buscador no tiene que descargar fotos de varios MB tal
        // cual las hace el móvil — la web carga mucho más rápido para
        // todo el mundo, sobre todo cuantos más negocios haya.
        let { width, height } = img;
        if (width > maxDimension || height > maxDimension) {
          if (width > height) {
            height = Math.round((height * maxDimension) / width);
            width = maxDimension;
          } else {
            width = Math.round((width * maxDimension) / height);
            height = maxDimension;
          }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        try {
          resolve(canvas.toDataURL("image/jpeg", quality));
        } catch {
          // Si algo falla al comprimir (formato raro, etc.), nos quedamos
          // con el archivo original en vez de bloquear la subida.
          resolve(reader.result);
        }
      };
      img.onerror = () => resolve(reader.result); // igual: no bloquear si la imagen no carga en <img>
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error("No se pudo leer la imagen."));
    reader.readAsDataURL(file);
  });
}

function ReviewForm({ onSubmit }) {
  const [name, setName] = useState("");
  const [rating, setRating] = useState(0);
  const [comment, setComment] = useState("");
  const [sending, setSending] = useState(false);
  const [error, setError] = useState("");

  return (
    <div className="flex flex-col gap-2.5 rounded-xl border-2 p-3.5" style={{ borderColor: BORDER, background: SURFACE }}>
      <p className="text-xs font-bold uppercase tracking-wide" style={{ color: DIM }}>Deja tu reseña</p>
      <Stars value={rating} size={20} onRate={setRating} />
      <Input placeholder="Tu nombre" value={name} onChange={setName} />
      <textarea
        placeholder="¿Qué tal la experiencia?"
        value={comment}
        onChange={(e) => setComment(e.target.value)}
        rows={2}
        className="text-sm rounded-xl px-3 py-2 outline-none resize-none"
        style={{ background: SURFACE_2, border: `2px solid ${BORDER}`, color: TEXT }}
      />
      {error && <p className="text-[12px] font-semibold" style={{ color: "#DC2626" }}>⚠️ {error}</p>}
      <button
        disabled={!name || !rating || sending}
        onClick={async () => {
          setSending(true);
          setError("");
          try {
            await onSubmit({ name, rating, comment });
            setName(""); setRating(0); setComment("");
          } catch (err) {
            setError(err.message || "No se pudo publicar la reseña. Inténtalo de nuevo.");
          } finally {
            setSending(false);
          }
        }}
        className="self-start text-xs px-4 py-2 rounded-full font-extrabold uppercase tracking-wide disabled:opacity-40"
        style={{ background: ORANGE, color: INK }}
      >
        Publicar reseña
      </button>

  );
}

function ReportLink({ proId }) {
  const [sent, setSent] = useState(false);
  const [sending, setSending] = useState(false);

  async function handleReport() {
    const reason = window.prompt(
      "¿Por qué quieres denunciar este anuncio? (por ejemplo: información falsa, no responde, suplantación...)"
    );
    if (reason === null || !reason.trim()) return;
    setSending(true);
    try {
      await reportProfessional(proId, reason.trim());
      setSent(true);
    } catch {
      alert("No se pudo enviar la denuncia ahora mismo. Inténtalo más tarde.");
    } finally {
      setSending(false);
    }
  }

  if (sent) {
    return (
      <p className="text-center text-[11px]" style={{ color: MUTED }}>
        Gracias, hemos recibido tu denuncia y la revisaremos.
      </p>
    );
  }

  return (
    <button
      onClick={handleReport}
      disabled={sending}
      className="text-center text-[11px] underline mx-auto disabled:opacity-50"
      style={{ color: DIM }}
    >
      {sending ? "Enviando…" : "Denunciar este anuncio"}
    </button>
  );
}

function SearchBar({ onSelectCategory }) {
  const [query, setQuery] = useState("");
  const [open, setOpen] = useState(false);

  const q = normalizeText(query);
  const matches = q.length < 2
    ? []
    : CATEGORIES.filter(
        (c) =>
          normalizeText(c.label).includes(q) ||
          c.keywords.some((k) => normalizeText(k).includes(q) || q.includes(normalizeText(k)))
      ).slice(0, 5);

  return (
    <div className="relative">
      <div className="relative">
        <Search size={17} className="absolute left-4 top-1/2 -translate-y-1/2" color={DIM} />
        <input
          value={query}
          onChange={(e) => { setQuery(e.target.value); setOpen(true); }}
          onFocus={() => setOpen(true)}
          placeholder="Ej: reparar persiana, fuga de agua, pintar piso…"
          className="w-full text-sm rounded-full pl-11 pr-4 py-3.5 outline-none"
          style={{ background: SURFACE_2, border: `2px solid ${BORDER}`, color: TEXT }}
        />
      </div>

      {open && q.length >= 2 && (
        <>
          <div className="fixed inset-0 z-10" onClick={() => setOpen(false)} />
          <div
            className="absolute z-20 mt-2 w-full rounded-2xl border-2 overflow-hidden"
            style={{ borderColor: BORDER, background: BG, boxShadow: "0 12px 32px -8px rgba(0,0,0,0.18)" }}
          >
            {matches.length === 0 ? (
              <p className="px-4 py-3.5 text-sm" style={{ color: MUTED }}>
                No encontramos ese oficio. Prueba a elegir uno de la lista de abajo.
              </p>
            ) : (
              matches.map((c) => {
                const Icon = c.icon;
                return (
                  <button
                    key={c.id}
                    onClick={() => { onSelectCategory(c.id); setQuery(""); setOpen(false); }}
                    className="w-full flex items-center gap-3 px-4 py-3 text-left transition-colors hover:opacity-80"
                    style={{ borderBottom: `1px solid ${BORDER}` }}
                  >
                    <Icon size={16} color={ORANGE} />
                    <span className="text-sm font-semibold">{c.label}</span>
                  </button>
                );
              })
            )}
          </div>
        </>
      )}
    </div>
  );
}

function TrialTag({ pro }) {

        style={{ background: "rgba(220,38,38,0.1)", color: "#DC2626", fontFamily: "IBM Plex Mono" }}
      >
        ● prueba ya usada
      </span>
    );
  }
  if (pro.canceled) {
    return (
      <span
        className="text-[11px] font-bold px-3 py-1.5 rounded-full uppercase tracking-wide"
        style={{ background: "rgba(107,114,128,0.14)", color: MUTED, fontFamily: "IBM Plex Mono" }}
      >
        ● cancelada
      </span>
    );
  }
  if (pro.status !== "active" || !pro.nextChargeAt) {
    return (
      <span
        className="text-[11px] font-bold px-3 py-1.5 rounded-full uppercase tracking-wide"
        style={{ background: "rgba(220,38,38,0.1)", color: "#DC2626", fontFamily: "IBM Plex Mono" }}
      >
        ● pendiente de pago
      </span>
    );
  }
  const d = daysLeft(pro.nextChargeAt);
  if (d > 0) {
    return (
      <span
        className="text-[11px] font-bold px-3 py-1.5 rounded-full uppercase tracking-wide"
        style={{ background: "rgba(13,148,136,0.12)", color: YELLOW, fontFamily: "IBM Plex Mono" }}
      >
        ● activo · {d}d restantes
      </span>
    );
  }
  return (
    <span
      className="text-[11px] font-bold px-3 py-1.5 rounded-full uppercase tracking-wide"
      style={{ background: "rgba(220,38,38,0.1)", color: "#DC2626", fontFamily: "IBM Plex Mono" }}
    >
      ● pendiente de renovar
    </span>
  );
}

          ⚡ Respuesta media &lt; 15 min · 🛡️ Perfil verificado

      )}

  );
}

function App() {
  const [mode, setModeState] = useState(() => {
    try {
      const params = new URLSearchParams(window.location.search);
      return params.get("vista") === "profesional" ? "profesional" : "cliente";
    } catch {
      return "cliente";
    }
  });
  const [professionals, setProfessionals] = useState([]);
  const [reviews, setReviews] = useState([]);
  const [loading, setLoading] = useState(true);
  const [legalPage, setLegalPage] = useState(null);
  const [adminOpen, setAdminOpenState] = useState(() => {
    try {
      return new URLSearchParams(window.location.search).get("panel") === "admin";
    } catch {
      return false;
    }
  });

  // Guarda solo que ESTÁS en la pantalla del panel (?panel=admin), nunca la
  // clave en sí — así al recargar sigues ahí, pero tienes que volver a
  // escribir la clave, que es lo seguro.
  function setAdminOpen(next) {
    setAdminOpenState(next);
    try {
      const url = new URL(window.location.href);
      if (next) {
        url.searchParams.set("panel", "admin");
      } else {
        url.searchParams.delete("panel");
      }
      window.history.replaceState({}, "", url);
    } catch {
      /* silencioso */
    }
  }

  // Al cambiar de modo, se guarda también en la URL (?vista=profesional),
  // así si recargas la página o compartes el enlace, te quedas donde estabas
  // en vez de volver siempre al inicio.
  function setMode(next) {
    setModeState(next);
    try {
      const url = new URL(window.location.href);
      if (next === "profesional") {
        url.searchParams.set("vista", "profesional");
      } else {
        url.searchParams.delete("vista");
      }
      window.history.replaceState({}, "", url);
    } catch {
      /* silencioso */
    }
  }

  useEffect(() => {
    try {
      const params = new URLSearchParams(window.location.search);
      const legal = params.get("legal");
      if (legal && LEGAL_CONTENT[legal]) {
        setLegalPage(legal);
      }
    } catch {
      /* silencioso */
    }
  }, []);

  useEffect(() => {
    (async () => {
      const [pros, revs] = await Promise.all([fetchProfessionals(), fetchReviews()]);
      setProfessionals(pros);
      setReviews(revs);
      setLoading(false);
    })();
  }, []);

  async function addReview(professionalId, review) {
    const entry = await createReview({ professionalId, ...review });
    setReviews((prev) => [...prev, entry]);
  }

  if (legalPage) {
    return (
      <div className="min-h-screen w-full" style={{ background: BG, color: TEXT, fontFamily: "Inter" }}>
        <HazardStrip />
        <LegalPage page={legalPage} onBack={() => setLegalPage(null)} />
      </div>
    );
  }

  if (adminOpen) {
    return (
      <div className="min-h-screen w-full" style={{ background: BG, color: TEXT, fontFamily: "Inter" }}>
        <HazardStrip />
        <AdminPanel onBack={() => setAdminOpen(false)} />
      </div>
    );
  }

  return (
    <div className="min-h-screen w-full" style={{ background: BG, color: TEXT, fontFamily: "Inter" }}>
      <HazardStrip />
      <Header mode={mode} setMode={setMode} />
      {loading ? (
        <div className="flex items-center justify-center py-24 gap-2" style={{ color: MUTED }}>
          <Loader2 className="animate-spin" size={18} />
          <span className="text-sm">Cargando el tablón…</span>
        </div>
      ) : mode === "cliente" ? (
        <ClienteView professionals={professionals} reviews={reviews} onAddReview={addReview} />
      ) : (
        <ProfesionalView professionals={professionals} setProfessionals={setProfessionals} />
      )}
      <Footer onNavigateLegal={setLegalPage} onOpenAdmin={() => setAdminOpen(true)} />
      <CookieBanner onOpenCookiesPage={() => setLegalPage("cookies")} />
    </div>
  );
}

function AdminPanel({ onBack }) {
  const [adminKey, setAdminKey] = useState("");
  const [unlocked, setUnlocked] = useState(false);
  const [tab, setTab] = useState("profesionales");
  const [pros, setPros] = useState([]);
  const [revs, setRevs] = useState([]);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [resetTarget, setResetTarget] = useState(null);
  const [newPassword, setNewPassword] = useState("");

  async function adminCall(action, extra) {
    const res = await fetch("/.netlify/functions/admin", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ adminKey, action, ...extra }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
    return data;
  }

  async function loadAll() {
    setLoading(true);
    setError("");
    try {
      const [p, r] = await Promise.all([adminCall("list-professionals"), adminCall("list-reviews")]);
      setPros(p);
      setRevs(r);
      setUnlocked(true);
    } catch (err) {
      setError(err.message || "No se pudo entrar. Revisa la clave.");
    } finally {
      setLoading(false);
    }
  }

  async function deletePro(id) {
    if (!window.confirm("¿Eliminar este anuncio por completo? No se puede deshacer.")) return;
    try {
      await adminCall("delete-professional", { id });
      setPros((prev) => prev.filter((p) => p.id !== id));
    } catch (err) {
      setError(err.message);
    }
  }

  async function activateManual(p) {
    const input = window.prompt(
      `Vas a activar el anuncio de "${p.name}" manualmente, SIN pasar por Stripe (por ejemplo, porque te ha pagado por Bizum directo). Tú te encargas de llevar el seguimiento de ese cobro.\n\n¿Por cuántos días lo activas?`,
      "30"
    );
    if (input === null) return;
    const days = Number(input);
    if (!days || days <= 0) {
      setError("Introduce un número de días válido.");
      return;
    }
    try {
      const entry = await adminCall("activate-manual", { id: p.id, days });
      setPros((prev) => prev.map((pro) => (pro.id === p.id ? entry : pro)));
    } catch (err) {
      setError(err.message);
    }
  }

  function viewReports(p) {
    const list = p.reports || [];
    const text = list
      .map((r, i) => `${i + 1}. ${new Date(r.date).toLocaleDateString("es-ES")} — ${r.reason}`)
      .join("\n");
    const clear = window.confirm(
      `Denuncias de "${p.name}" (${list.length}):\n\n${text}\n\n¿Marcar como revisadas y borrarlas?`
    );
    if (!clear) return;
    adminCall("clear-reports", { id: p.id })
      .then((entry) => setPros((prev) => prev.map((pro) => (pro.id === p.id ? entry : pro))))
      .catch((err) => setError(err.message));
  }

  async function deleteReview(id) {
    if (!window.confirm("¿Eliminar esta reseña?")) return;
    try {
      await adminCall("delete-review", { id });
      setRevs((prev) => prev.filter((r) => r.id !== id));
    } catch (err) {
      setError(err.message);
    }
  }

  async function submitReset() {
    if (!resetTarget || newPassword.length < 6) {
      setError("La nueva contraseña debe tener al menos 6 caracteres.");
      return;
    }
    try {
      await adminCall("reset-password", { id: resetTarget.id, newPassword });
      setResetTarget(null);
      setNewPassword("");
      setError("");
      alert(`Contraseña actualizada para ${resetTarget.name}. Comunícasela al profesional por un canal seguro.`);
    } catch (err) {
      setError(err.message);
    }
  }

  if (!unlocked) {
    return (
      <main className="max-w-sm mx-auto px-5 pb-16 pt-16">
        <button onClick={onBack} className="flex items-center gap-1.5 text-sm font-semibold mb-6" style={{ color: MUTED }}>
          <ArrowLeft size={15} /> Volver a Gremio
        </button>
        <div className="flex items-center gap-2 mb-4">
          <Lock size={18} color={MUTED} />
          <h1 className="text-lg font-extrabold">Panel de administración</h1>
        </div>
        <Input placeholder="Clave de administrador" value={adminKey} onChange={setAdminKey} type="password" />
        {error && <p className="text-[12px] font-semibold mt-2" style={{ color: "#DC2626" }}>⚠️ {error}</p>}
        <button
          disabled={!adminKey || loading}
          onClick={loadAll}
          className="w-full mt-3 text-sm px-6 py-3 rounded-full font-extrabold uppercase tracking-wide disabled:opacity-50"
          style={{ background: "#2563EB", color: "#FFFFFF" }}
        >
          {loading ? <Loader2 size={15} className="animate-spin" /> : "Entrar"}
        </button>
      </main>
    );
  }

  return (
    <main className="max-w-3xl mx-auto px-5 pb-16 pt-10">
      <button onClick={onBack} className="flex items-center gap-1.5 text-sm font-semibold mb-6" style={{ color: MUTED }}>
        <ArrowLeft size={15} /> Volver a Gremio
      </button>
      <h1 className="text-lg font-extrabold mb-4">Panel de administración</h1>

      <div className="flex gap-2 mb-6">
        <TabButton active={tab === "profesionales"} onClick={() => setTab("profesionales")}>Profesionales ({pros.length})</TabButton>
        <TabButton active={tab === "resenas"} onClick={() => setTab("resenas")}>Reseñas ({revs.length})</TabButton>
      </div>

      {error && <p className="text-[12px] font-semibold mb-4" style={{ color: "#DC2626" }}>⚠️ {error}</p>}

      {tab === "profesionales" && (
        <div className="flex flex-col gap-3">
          {pros.length === 0 && <p className="text-sm" style={{ color: MUTED }}>No hay profesionales todavía.</p>}
          {pros.map((p) => (
            <div key={p.id} className="rounded-xl border-2 p-3.5 flex items-center justify-between gap-3 flex-wrap" style={{ borderColor: (p.reports?.length > 0) ? "#DC2626" : BORDER, background: SURFACE }}>
              <div className="min-w-0">
                <p className="text-sm font-bold truncate flex items-center gap-2">
                  {p.name}
                  {p.reports?.length > 0 && (
                    <button
                      onClick={() => viewReports(p)}
                      className="text-[10px] font-extrabold px-2 py-0.5 rounded-full uppercase shrink-0"
                      style={{ background: "#DC2626", color: "#FFFFFF" }}
                    >
                      ⚠ {p.reports.length} denuncia{p.reports.length > 1 ? "s" : ""}
                    </button>
                  )}
                  <span className="font-normal" style={{ color: DIM }}>· {catInfo(p.category).label} · {p.zone}</span>
                </p>
                <p className="text-xs mt-0.5" style={{ color: MUTED }}>
                  {p.phone} · {p.email} · estado: <strong>{p.status}</strong>{p.canceled ? " · cancelado" : ""}
                </p>
              </div>
              <div className="flex gap-2 shrink-0">
                <button
                  onClick={() => activateManual(p)}
                  className="text-[11px] font-bold px-3 py-1.5 rounded-full uppercase"
                  style={{ background: "rgba(13,148,136,0.14)", color: YELLOW, border: `1px solid ${YELLOW}` }}
                >
                  Activar manual (Bizum/otro)
                </button>
                <button
                  onClick={() => setResetTarget(p)}
                  className="text-[11px] font-bold px-3 py-1.5 rounded-full uppercase"
                  style={{ background: SURFACE_2, color: TEXT, border: `1px solid ${BORDER}` }}
                >
                  Resetear contraseña
                </button>
                <button
                  onClick={() => deletePro(p.id)}
                  className="text-[11px] font-bold px-3 py-1.5 rounded-full uppercase"
                  style={{ color: "#DC2626", border: "1px solid #DC2626" }}
                >
                  Eliminar
                </button>
              </div>
            </div>
          ))}
        </div>
      )}

      {tab === "resenas" && (
        <div className="flex flex-col gap-3">
          {revs.length === 0 && <p className="text-sm" style={{ color: MUTED }}>No hay reseñas todavía.</p>}
          {revs.map((r) => (
            <div key={r.id} className="rounded-xl border-2 p-3.5 flex items-center justify-between gap-3" style={{ borderColor: BORDER, background: SURFACE }}>
              <div className="min-w-0">
                <p className="text-sm font-bold">{r.name} · {"★".repeat(r.rating)}</p>
                <p className="text-xs mt-0.5 truncate" style={{ color: MUTED }}>{r.comment}</p>
              </div>
              <button
                onClick={() => deleteReview(r.id)}
                className="text-[11px] font-bold px-3 py-1.5 rounded-full uppercase shrink-0"
                style={{ color: "#DC2626", border: "1px solid #DC2626" }}
              >
                Eliminar
              </button>
            </div>
          ))}
        </div>
      )}

      {resetTarget && (
        <div className="fixed inset-0 flex items-center justify-center p-5" style={{ background: "rgba(0,0,0,0.5)" }}>
          <div className="rounded-2xl p-5 w-full max-w-sm" style={{ background: BG }}>
            <p className="text-sm font-extrabold mb-3">Nueva contraseña para {resetTarget.name}</p>
            <Input placeholder="Nueva contraseña (mín. 6)" value={newPassword} onChange={setNewPassword} type="password" />
            <div className="flex gap-2 mt-3">
              <button
                onClick={() => { setResetTarget(null); setNewPassword(""); }}
                className="flex-1 text-sm px-4 py-2.5 rounded-full font-extrabold uppercase"
                style={{ border: `1px solid ${BORDER}`, color: MUTED }}
              >
                Cancelar
              </button>
              <button
                onClick={submitReset}
                className="flex-1 text-sm px-4 py-2.5 rounded-full font-extrabold uppercase"
                style={{ background: "#2563EB", color: "#FFFFFF" }}
              >
                Guardar
              </button>
            </div>
          </div>
        </div>
      )}
    </main>
  );
}

// Permite arrastrar con el ratón (además del deslizamiento táctil que ya
// funciona en móvil) cualquier tira horizontal, y ofrece un método para
// desplazarla con botones de flecha. Pensado para usar la web con ratón
// en ordenador.
function useDragScroll() {
  const ref = useRef(null);
  const state = useRef({ down: false, startX: 0, scrollLeft: 0, moved: false });

  function onPointerDown(e) {
    const el = ref.current;
    if (!el) return;
    state.current.down = true;
    state.current.moved = false;
    state.current.startX = e.pageX;
    state.current.scrollLeft = el.scrollLeft;
  }
  function onPointerMove(e) {
    if (!state.current.down || !ref.current) return;
    const walk = e.pageX - state.current.startX;
    if (Math.abs(walk) > 4) state.current.moved = true;
    ref.current.scrollLeft = state.current.scrollLeft - walk;
  }
  function stop() {
    state.current.down = false;
  }
  function scrollByAmount(amount) {
    ref.current?.scrollBy({ left: amount, behavior: "smooth" });
  }
  function wasDragged() {
    return state.current.moved;
  }

  return {
    ref,
    scrollByAmount,
    wasDragged,
    handlers: {
      onPointerDown,
      onPointerMove,
      onPointerUp: stop,
      onPointerLeave: stop,
      onPointerCancel: stop,
    },
  };
}

function ScrollArrows({ drag }) {
  return (
    <>

        type="button"

    try {
      const params = new URLSearchParams(window.location.search);
      const cat = params.get("categoria");
      return cat && CATEGORIES.some((c) => c.id === cat) ? cat : null;
    } catch {
      return null;
    }
  });
  const [isUrgent, setIsUrgentState] = useState(() => {
    try {
      return new URLSearchParams(window.location.search).get("urgente") === "1";
    } catch {
      return false;
    }
  });
  const [selectedCity, setSelectedCity] = useState("");
  const [sortBy, setSortBy] = useState("relevancia");
  const [locating, setLocating] = useState(true);
  const [openPro, setOpenPro] = useState(null);
  const catDrag = useDragScroll();

  // Guarda la categoría/urgencias elegidas en la URL, para que recargar la
  // página (o compartir el enlace) te deje justo donde estabas, no en el
  // inicio.
  function syncFilterUrl(nextCat, nextUrgent) {
    try {
      const url = new URL(window.location.href);
      if (nextUrgent) {
        url.searchParams.set("urgente", "1");
        url.searchParams.delete("categoria");
      } else if (nextCat) {
        url.searchParams.set("categoria", nextCat);
        url.searchParams.delete("urgente");
      } else {
        url.searchParams.delete("categoria");
        url.searchParams.delete("urgente");
      }
      window.history.replaceState({}, "", url);
    } catch {
      /* silencioso */
    }
  }

  useEffect(() => {
    if (!navigator.geolocation) {
      setLocating(false);
      return;
    }
    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        try {
          const res = await fetch(
            `https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}`
          );
          const data = await res.json();
          const guess = data?.address?.city || data?.address?.town || data?.address?.village || data?.address?.county;
          const match = CITIES.find((c) => guess && (normalizeText(c) === normalizeText(guess) || normalizeText(guess).includes(normalizeText(c))));
          if (match) setSelectedCity(match);
        } catch {
          /* silencioso: si falla, se queda en "Toda Andalucía" */
        } finally {
          setLocating(false);
        }
      },
      () => setLocating(false),
      { timeout: 6000 }
    );
  }, []);

  const filtered = isUrgent
    ? professionals.filter(
        (p) =>
          p.urgent24h &&
          p.status === "active" &&
          !p.canceled &&
          (!selectedCity || normalizeText(p.zone).includes(normalizeText(selectedCity)))
      )
    : selectedCat
    ? professionals.filter(
        (p) =>
          p.category === selectedCat &&
          p.status === "active" &&
          !p.canceled &&
          (!selectedCity || normalizeText(p.zone).includes(normalizeText(selectedCity)))

      return rb - ra;

    if (sortBy === "recientes") {
      return (b.createdAt || 0) - (a.createdAt || 0);
    }
    return 0; // relevancia: orden original

      <section className="mt-8">
        {!selectedCat && !isUrgent && <WelcomeState />}

        {(isUrgent || selectedCat) && filtered.length === 0 && (
          <EmptyState
            icon={Inbox}
            text={
              isUrgent

                : selectedCity
                ? `Nadie en ${catInfo(selectedCat).label.toLowerCase()} en ${selectedCity} todavía. Prueba con "Toda Andalucía" o sé el primero en publicarte.`
                : `Todavía no hay nadie en ${catInfo(selectedCat).label.toLowerCase()}. Sé el primero en publicarte desde "Soy profesional".`

        {(isUrgent || selectedCat) && filtered.length > 1 && (

              ].map((opt) => (

        <div className="grid sm:grid-cols-2 gap-4 min-w-0" style={{ overflowX: "hidden" }}>

function ProfesionalView({ professionals, setProfessionals }) {
  const [tab, setTab] = useState("publicar");

  async function createPending(form) {
    const entry = await createProfessional(form);
    setProfessionals((prev) => [...prev, entry]);
    return entry;
  }

  async function refreshOne(id) {
    const entry = await fetchProfessionalById(id);
    setProfessionals((prev) => prev.map((p) => (p.id === id ? entry : p)));
    return entry;
  }

  async function lookupMine(phone, password) {
    return lookupMyProfessionals(phone, password);
  }

  async function toggleCancel(proId, password, canceled) {
    const entry = await cancelProfessional(proId, password, canceled);
    setProfessionals((prev) => prev.map((p) => (p.id === proId ? entry : p)));
    return entry;
  }

  async function updateOne(proId, password, updates) {
    const entry = await updateProfessional(proId, password, updates);
    setProfessionals((prev) => prev.map((p) => (p.id === proId ? entry : p)));
    return entry;
  }

  return (
    <main className="max-w-3xl mx-auto px-5 pb-16 pt-12">
      <div className="flex gap-2 mb-8">
        <TabButton active={tab === "publicar"} onClick={() => setTab("publicar")}>Publicar mi servicio</TabButton>
        <TabButton active={tab === "panel"} onClick={() => setTab("panel")}>Mi panel</TabButton>
      </div>

      {tab === "publicar" && (
        <PublishForm onCreatePending={createPending} onCheckStatus={refreshOne} onDone={() => setTab("panel")} />
      )}
      {tab === "panel" && <PanelView onLookup={lookupMine} onToggleCancel={toggleCancel} onRefresh={refreshOne} onUpdate={updateOne} />}
    </main>
  );
}

                e.target.value = "";
                if (!file) return;
                setUploading(true);
                setError("");
                try {
                  const dataUrl = await readFileAsDataUrl(file, 900_000);
                  const url = await uploadPhoto(dataUrl);
                  onChange([...value, url]);
                } catch (err) {
                  setError(err.message || "No se pudo subir la imagen.");
                } finally {
                  setUploading(false);
                }
              }}
            />
          </label>
        )}
      </div>
      <p className="text-[11px] mt-1.5" style={{ color: DIM }}>
        Hasta {MAX_PHOTOS} fotos de tu negocio o trabajos · Máximo 900 KB por imagen.
      </p>
      {error && <p className="text-[11px] mt-1 font-semibold" style={{ color: "#DC2626" }}>⚠️ {error}</p>}
    </div>
  );
}

function StripeStep({ pending, onBack, onActivated, onCheckStatus }) {
  const [checking, setChecking] = useState(false);
  const [message, setMessage] = useState("");
  const [denied, setDenied] = useState(false);
  const payUrl = `${STRIPE_PAYMENT_LINK}?client_reference_id=${encodeURIComponent(pending.id)}&prefilled_email=${encodeURIComponent(pending.email || "")}`;

  async function checkNow(showMessage) {
    setChecking(true);
    try {
      const entry = await onCheckStatus(pending.id);
      if (entry.status === "active") {
        onActivated(entry);
        return;
      }
      if (entry.status === "trial_denied") {
        setDenied(true);
        return;
      }
      if (showMessage) {
        setMessage(
          "Todavía no hemos recibido la confirmación de Stripe. Si ya has pagado, espera unos segundos e inténtalo de nuevo — esta pantalla también lo comprueba sola."
        );
      }
    } catch {
      if (showMessage) setMessage("No se pudo comprobar el estado ahora mismo. Vuelve a intentarlo en unos segundos.");
    } finally {
      setChecking(false);
    }
  }

  // Comprueba solo, cada pocos segundos, si Stripe ya ha confirmado el pago
  // (por si el usuario vuelve de pagar y no pulsa el botón manualmente).
  useEffect(() => {
    if (denied) return;
    const interval = setInterval(() => checkNow(false), 4000);
    return () => clearInterval(interval);
  }, [pending.id, denied]);

  if (denied) {
    return (
      <div className="flex flex-col gap-5">
        <button onClick={onBack} className="flex items-center gap-1.5 text-sm font-semibold w-fit" style={{ color: MUTED }}>
          <ArrowLeft size={15} /> Volver a tus datos
        </button>
        <div className="rounded-2xl border-2 p-6 flex flex-col gap-3" style={{ borderColor: "#DC2626", background: "#FEF2F2" }}>
          <p className="text-sm font-extrabold" style={{ color: "#7F1D1D" }}>⚠️ Ya usaste la prueba gratuita antes</p>
          <p className="text-sm" style={{ color: "#7F1D1D" }}>
            Ese correo ya inició una prueba gratuita con nosotros anteriormente, así que no puede
            volver a activarse gratis. Tu suscripción se ha cancelado automáticamente y no se te ha
            cobrado nada. Para publicar este anuncio, contacta con nosotros para activarlo con pago
            inmediato.
          </p>
        </div>
      </div>
    );
  }

  return (
    <div className="flex flex-col gap-5">
      <button onClick={onBack} className="flex items-center gap-1.5 text-sm font-semibold w-fit" style={{ color: MUTED }}>
        <ArrowLeft size={15} /> Volver a tus datos
      </button>

      <div className="rounded-2xl border-2 overflow-hidden" style={{ borderColor: ORANGE, background: SURFACE }}>
        <div className="px-6 py-5" style={{ background: "rgba(47,111,237,0.08)" }}>
          <p className="text-[11px] font-bold uppercase tracking-[0.2em]" style={{ color: ORANGE, fontFamily: "IBM Plex Mono" }}>
            plan gremio pro
          </p>
          <div className="flex items-baseline gap-2 mt-2">
            <span className="text-4xl" style={{ fontFamily: "Archivo Black" }}>0€</span>
            <span className="text-sm" style={{ color: MUTED }}>ahora — prueba gratuita de {TRIAL_DAYS} días</span>
          </div>
          <p className="text-sm mt-1" style={{ color: "#374151" }}>
            Después, <span style={{ fontWeight: 800, color: TEXT }}>{MONTHLY_PRICE}€/mes</span>. Publicarás como{" "}
            <span style={{ fontWeight: 800, color: TEXT }}>"{pending.name}"</span>. Tu anuncio se activa en cuanto confirmes con Stripe.
          </p>
        </div>

        <div className="px-6 py-5 flex flex-col gap-3">
          {[
            "Tu servicio visible en la categoría que elegiste, con tu logo y fotos",
            "Los clientes te escriben directo a tu WhatsApp",
            "Cancela cuando quieras desde tu panel",
          ].map((line) => (
            <div key={line} className="flex items-start gap-2.5 text-sm" style={{ color: "#374151" }}>
              <ShieldCheck size={16} color={YELLOW} className="shrink-0 mt-0.5" />
              {line}
            </div>
          ))}
        </div>

        <div className="px-6 py-5" style={{ borderTop: `1px solid ${BORDER}` }}>
          <div className="flex items-center gap-2 mb-3">
            <span
              className="text-[13px] font-extrabold px-2.5 py-1 rounded-lg"
              style={{ background: "#635BFF", color: "#FFFFFF", fontFamily: "IBM Plex Mono" }}
            >
              Stripe
            </span>
            <p className="text-[11px] font-bold uppercase tracking-wide" style={{ color: DIM }}>
              Pago seguro y cifrado
            </p>
          </div>
          <p className="text-sm" style={{ color: "#374151" }}>
            Al pulsar el botón se abre la página de pago de Stripe en una pestaña nueva. Introduce
            tu tarjeta ahí — nunca la escribes en esta web. No se te cobra nada hoy.
          </p>
        </div>

        <div className="px-6 pb-6 flex flex-col gap-3">
          <a
            href={payUrl}
            target="_blank"
            rel="noopener noreferrer"
            className="w-full text-sm px-6 py-3.5 rounded-full font-extrabold uppercase tracking-wide flex items-center justify-center gap-2 transition-all hover:scale-[1.02]"
            style={{ background: "#635BFF", color: "#FFFFFF", boxShadow: "0 10px 24px -6px rgba(99,91,255,0.45)" }}
          >
            Empezar prueba gratuita de {TRIAL_DAYS} días <ArrowUpRight size={15} strokeWidth={3} />
          </a>

          <button
            disabled={checking}
            onClick={() => checkNow(true)}
            className="w-full text-sm px-6 py-3.5 rounded-full font-extrabold uppercase tracking-wide flex items-center justify-center gap-2 transition-all hover:scale-[1.02] disabled:cursor-not-allowed"
            style={{ background: SURFACE_2, color: TEXT, border: `2px solid ${BORDER}` }}
          >
            {checking ? <Loader2 size={15} className="animate-spin" /> : null} Comprobar estado del pago
          </button>
          {message && (
            <p className="text-[12px] text-center font-semibold" style={{ color: "#DC2626" }}>{message}</p>
          )}
          <p className="text-[12px] text-center" style={{ color: "#4B5563" }}>
            Nadie puede activar el anuncio sin pagar de verdad: solo se publica cuando Stripe nos
            confirma el pago. Esta pantalla lo comprueba sola cada pocos segundos.
          </p>
        </div>
      </div>
    </div>
  );
}

function PanelView({ onLookup, onToggleCancel, onRefresh, onUpdate }) {
  const [phone, setPhone] = useState("");
  const [password, setPassword] = useState("");
  const [mine, setMine] = useState([]);
  const [searched, setSearched] = useState(false);
  const [searching, setSearching] = useState(false);
  const [searchError, setSearchError] = useState("");
  const [busyId, setBusyId] = useState(null);
  const [actionError, setActionError] = useState("");
  const [editingId, setEditingId] = useState(null);
  const [editForm, setEditForm] = useState(null);
  const [savingEdit, setSavingEdit] = useState(false);
  const [editError, setEditError] = useState("");

  function startEditing(pro) {
    setEditingId(pro.id);
    setEditError("");
    setEditForm({
      name: pro.name || "",
      category: pro.category || CATEGORIES[0].id,
      zone: pro.zone || "",
      price: pro.price || "",
      description: pro.description || "",
      urgent24h: !!pro.urgent24h,
    });
  }

  function cancelEditing() {
    setEditingId(null);
    setEditForm(null);
    setEditError("");
  }

  async function saveEditing(pro) {
    setSavingEdit(true);
    setEditError("");
    try {
      const entry = await onUpdate(pro.id, password, editForm);
      setMine((prev) => prev.map((p) => (p.id === pro.id ? entry : p)));
      setEditingId(null);
      setEditForm(null);
    } catch (err) {
      setEditError(err.message || "No se pudieron guardar los cambios.");
    } finally {
      setSavingEdit(false);
    }
  }

  async function handleSearch() {
    setSearching(true);
    setSearchError("");
    setActionError("");
    try {
      const results = await onLookup(phone, password);
      setMine(results);
      setSearched(true);
    } catch (err) {
      setSearchError(err.message || "No se pudo buscar tu panel ahora mismo.");
    } finally {
      setSearching(false);
    }
  }

  async function handleToggle(pro, canceled) {
    setBusyId(pro.id);
    setActionError("");
    try {
      const entry = await onToggleCancel(pro.id, password, canceled);
      setMine((prev) => prev.map((p) => (p.id === pro.id ? entry : p)));
    } catch (err) {
      setActionError(err.message || "No se pudo actualizar tu anuncio.");
    } finally {
      setBusyId(null);
    }
  }

  async function handleRefresh(pro) {
    setBusyId(pro.id);
    setActionError("");
    try {
      const entry = await onRefresh(pro.id);
      setMine((prev) => prev.map((p) => (p.id === pro.id ? entry : p)));
    } catch (err) {
      setActionError("No se pudo comprobar el estado ahora mismo.");
    } finally {
      setBusyId(null);
    }
  }

  return (
    <div className="flex flex-col gap-6">
      <div className="flex flex-col sm:flex-row gap-2">
        <Input placeholder="Tu número de WhatsApp" value={phone} onChange={setPhone} inputMode="numeric" />

          onClick={handleSearch}
          className="text-sm px-5 py-2.5 rounded-full font-extrabold uppercase tracking-wide shrink-0 disabled:opacity-50"
          style={{ background: SURFACE_2, color: TEXT, border: `2px solid ${BORDER}` }}

      </div>
      <div className="flex items-center gap-2 -mt-2 flex-wrap">
        <p className="text-[12px]" style={{ color: DIM }}>
          Es la contraseña que creaste al publicar tu anuncio. ¿La olvidaste?
        </p>
        <a
          href={`https://wa.me/${waNumber("633772121")}?text=${encodeURIComponent("Hola, he olvidado la contraseña de mi panel en Gremio y necesito recuperarla.")}`}
          target="_blank"
          rel="noreferrer"
          className="text-[11px] px-3.5 py-1.5 rounded-full font-extrabold uppercase tracking-wide inline-flex items-center gap-1.5 transition-transform hover:scale-105 shrink-0"
          style={{ background: WHATSAPP, color: "#04150C", boxShadow: "0 6px 16px -6px rgba(37,211,102,0.55)" }}

        <p className="text-[12px] font-semibold" style={{ color: "#DC2626" }}>⚠️ {actionError}</p>

      {mine.map((pro) => (

          <TicketStub>
            <div className="flex items-center justify-between flex-wrap gap-3">
              <div className="flex items-center gap-3 min-w-0">
                <ProAvatar pro={pro} size={52} />
                <div className="min-w-0">
                  <p style={{ fontFamily: "Archivo Black" }} className="uppercase truncate">{pro.name}</p>
                  <p className="text-xs mt-1" style={{ color: MUTED }}>

                </div>
              </div>
              <div className="flex items-center gap-2">
                <TrialTag pro={pro} />

                  <button

                    style={{ color: "#2563EB", border: `1px solid #2563EB` }}

                    className="text-[11px] font-semibold px-3 py-1.5 rounded-full uppercase tracking-wide flex items-center gap-1 disabled:opacity-50"

            </div>

            <div className="rounded-2xl border-2 p-4 flex flex-col gap-3" style={{ borderColor: "#2563EB", background: SURFACE }}>

                    className="w-full text-sm rounded-xl px-3 py-2.5 outline-none"
                    style={{ background: SURFACE_2, border: `2px solid ${BORDER}`, color: TEXT }}

                      <option key={c.id} value={c.id}>{c.label}</option>

                <div>
                  <p className="text-[11px] font-bold uppercase tracking-wide mb-1.5" style={{ color: DIM }}>Zona</p>
                  <Input placeholder="ej. Málaga capital" value={editForm.zone} onChange={(v) => setEditForm((f) => ({ ...f, zone: v }))} />

                <div>
                  <p className="text-[11px] font-bold uppercase tracking-wide mb-1.5" style={{ color: DIM }}>Precio orientativo</p>

              </div>

              <div>
                <p className="text-[11px] font-bold uppercase tracking-wide mb-1.5 flex items-center justify-between" style={{ color: DIM }}>
                  <span>Descripción</span>
                  <span style={{ color: editForm.description.length >= 300 ? "#DC2626" : DIM }}>{editForm.description.length}/300</span>
                </p>
                <textarea

                  value={editForm.description}
                  onChange={(e) => setEditForm((f) => ({ ...f, description: e.target.value.slice(0, 300) }))}

                  rows={3}
                  className="w-full text-sm rounded-xl px-3 py-2.5 outline-none resize-none"
                  style={{ background: SURFACE_2, border: `2px solid ${BORDER}`, color: TEXT }}

              </div>

              <label
                className="flex items-start gap-3 rounded-2xl border-2 p-4 cursor-pointer"
                style={{
                  borderColor: editForm.urgent24h ? "#DC2626" : BORDER,
                  background: editForm.urgent24h ? "#FEF2F2" : SURFACE,

              >
                <input
                  type="checkbox"
                  checked={editForm.urgent24h}
                  onChange={(e) => setEditForm((f) => ({ ...f, urgent24h: e.target.checked }))}

                <div>
                  <p className="text-sm font-extrabold flex items-center gap-1.5" style={{ color: editForm.urgent24h ? "#DC2626" : TEXT }}>
                    <span className="relative inline-flex rounded-full h-2 w-2" style={{ background: "#DC2626" }} />

                  </p>
                </div>

                <p className="text-[12px] font-semibold" style={{ color: "#DC2626" }}>⚠️ {editError}</p>

              <div className="flex items-center gap-2">
                <button

                  className="text-xs px-4 py-2.5 rounded-full font-extrabold uppercase tracking-wide flex items-center gap-1.5 disabled:opacity-50"
                  style={{ background: "#2563EB", color: "#FFFFFF" }}
                >

                </button>
                <button
                  disabled={savingEdit}
                  onClick={cancelEditing}
                  className="text-xs px-4 py-2.5 rounded-full font-extrabold uppercase tracking-wide disabled:opacity-50"
                  style={{ color: MUTED, border: `1px solid ${BORDER}` }}

                </button>
              </div>
            </div>
          )}

          {pro.photos?.length > 0 && (
            <div className="flex gap-2 flex-wrap">
              {pro.photos.map((src, i) => (
                <img key={i} src={src} alt={`Foto ${i + 1}`} className="h-16 w-16 rounded-lg object-cover" style={{ border: `1px solid ${BORDER}` }} />
              ))}

          )}

          <div
            className="rounded-2xl border-2 p-4 flex items-center justify-between gap-3"
            style={{ borderColor: BORDER, background: SURFACE }}

            <div className="flex items-center gap-2 text-sm" style={{ color: MUTED }}>
              <Clock size={14} /> Los clientes te escriben directo a tu WhatsApp
            </div>
            <WhatsAppButton pro={pro} />
          </div>

          <div className="rounded-2xl border-2 p-4 flex flex-col gap-3" style={{ borderColor: BORDER, background: SURFACE }}>
            <div className="flex items-center justify-between flex-wrap gap-2">
              <div className="flex items-center gap-2">
                <span
                  className="text-[11px] font-extrabold px-2 py-1 rounded"
                  style={{ background: "#635BFF", color: "#FFFFFF", fontFamily: "IBM Plex Mono" }}
                >
                  Stripe
                </span>
                <p className="text-sm font-semibold">
                  {pro.status === "trial_denied" ? `${MONTHLY_PRICE}€/mes` : `0€ ahora · luego ${MONTHLY_PRICE}€/mes`}
                </p>
              </div>
              {pro.status === "active" && !pro.canceled && (
                <div className="text-right">
                  <p className="text-[11px] font-bold uppercase tracking-wide" style={{ color: DIM }}>
                    {daysLeft(pro.nextChargeAt) > 0 ? "Termina el" : "Terminó el"}
                  </p>
                  <p className="text-sm font-semibold mt-0.5">
                    {new Date(pro.nextChargeAt).toLocaleDateString("es-ES", { day: "numeric", month: "short", year: "numeric" })}
                  </p>
                </div>
              )}
            </div>

            {pro.status !== "active" && !pro.canceled && (
              <div className="flex flex-col gap-2">
                <a
                  href={`${STRIPE_PAYMENT_LINK}?client_reference_id=${encodeURIComponent(pro.id)}`}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="self-start text-xs px-4 py-2 rounded-full font-extrabold uppercase tracking-wide flex items-center gap-1.5"
                  style={{ background: "#635BFF", color: "#FFFFFF" }}
                >
                  Activar con Stripe <ArrowUpRight size={13} strokeWidth={3} />
                </a>
                <button
                  disabled={busyId === pro.id}
                  onClick={() => handleRefresh(pro)}
                  className="self-start text-xs px-4 py-2 rounded-full font-extrabold uppercase tracking-wide flex items-center gap-1.5 disabled:opacity-50"
                  style={{ color: MUTED, border: `1px solid ${BORDER}` }}
                >
                  {busyId === pro.id ? <Loader2 size={12} className="animate-spin" /> : null} Comprobar estado del pago
                </button>
              </div>
            )}

            {pro.status === "trial_denied" && (
              <p className="text-sm" style={{ color: "#DC2626" }}>
                El correo usado ya había iniciado una prueba gratuita antes, así que se canceló
                automáticamente (no se te cobró nada). Contacta con nosotros para activar este
                anuncio con pago inmediato.
              </p>
            )}

            {pro.status === "active" && !pro.canceled && daysLeft(pro.nextChargeAt) <= 0 && (
              <div className="flex flex-col gap-2">
                <a
                  href={`${STRIPE_PAYMENT_LINK}?client_reference_id=${encodeURIComponent(pro.id)}`}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="self-start text-xs px-4 py-2 rounded-full font-extrabold uppercase tracking-wide flex items-center gap-1.5"
                  style={{ background: "#635BFF", color: "#FFFFFF" }}
                >
                  Renovar con Stripe <ArrowUpRight size={13} strokeWidth={3} />
                </a>
                <button
                  disabled={busyId === pro.id}
                  onClick={() => handleRefresh(pro)}
                  className="self-start text-xs px-4 py-2 rounded-full font-extrabold uppercase tracking-wide flex items-center gap-1.5 disabled:opacity-50"
                  style={{ color: MUTED, border: `1px solid ${BORDER}` }}
                >
                  {busyId === pro.id ? <Loader2 size={12} className="animate-spin" /> : null} Comprobar estado del pago
                </button>
              </div>
            )}

            {pro.renewals?.length > 0 && (
              <div className="flex flex-col gap-1.5 pt-1" style={{ borderTop: `1px solid ${BORDER}` }}>
                <p className="text-[11px] font-bold uppercase tracking-wide pt-2" style={{ color: DIM }}>Historial de activaciones</p>
                {[...pro.renewals].reverse().map((ren) => (
                  <div key={ren.id} className="flex items-center justify-between text-sm">
                    <span style={{ color: "#374151" }}>
                      {new Date(ren.date).toLocaleDateString("es-ES", { day: "numeric", month: "short", year: "numeric" })}
                    </span>
                    <span className="font-bold" style={{ color: YELLOW, fontFamily: "IBM Plex Mono" }}>
                      Confirmado por Stripe
                    </span>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      ))}
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    console.error("Error capturado por ErrorBoundary:", error, info);
  }
  render() {
    if (this.state.error) {
      const err = this.state.error;
      const msg = err && err.stack ? err.stack : err && err.message ? err.message : String(err);
      return (
        <div
          style={{
            fontFamily: "ui-monospace, Menlo, Consolas, monospace",
            whiteSpace: "pre-wrap",
            padding: 24,
            color: "#7F1D1D",
            background: "#FEF2F2",
            minHeight: "100vh",
            fontSize: 13,
            lineHeight: 1.5,
            boxSizing: "border-box",
          }}
        >
          <div style={{ fontWeight: 800, fontSize: 15, marginBottom: 10 }}>⚠️ Ha fallado un componente de la app</div>
          <div>{msg}</div>
          <div style={{ marginTop: 16, fontSize: 11, color: "#991B1B" }}>Comparte este mensaje para poder arreglarlo.</div>
        </div>
      );
    }
    return this.props.children;
  }
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(
  <ErrorBoundary>
    <App />
  </ErrorBoundary>
);
</script>

<!--
  Loader: carga React, ReactDOM y Babel probando varias CDNs (unpkg y
  jsDelivr) por si una está caída o bloqueada, y solo cuando las tres están
  disponibles transforma con Babel el código de #app-source y lo ejecuta.
  Los iconos son SVG integrados en el propio archivo, así que no dependen
  de ninguna CDN ni pueden bloquear el arranque de la app.
-->
<script>
(function () {
  function loadScript(url, timeoutMs) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = url;
      s.crossOrigin = "anonymous";
      var done = false;
      var timer = setTimeout(function () {
        if (done) return;
        done = true;
        s.remove();
        reject(new Error("Tiempo de espera agotado cargando: " + url));
      }, timeoutMs || 10000);
      s.onload = function () {
        if (done) return;
        done = true;
        clearTimeout(timer);
        resolve();
      };
      s.onerror = function () {
        if (done) return;
        done = true;
        clearTimeout(timer);
        reject(new Error("No se pudo cargar: " + url));
      };
      document.head.appendChild(s);
    });
  }

  // Prueba cada URL de la lista en orden hasta que una funcione.
  function loadWithFallback(urls) {
    var i = 0;
    function attempt() {
      if (i >= urls.length) {
        return Promise.reject(new Error("Ninguna CDN respondió para:\n" + urls.join("\n")));
      }
      var url = urls[i++];
      return loadScript(url).catch(function (err) {
        console.warn(err.message + " — probando siguiente CDN…");
        return attempt();
      });
    }
    return attempt();
  }

  var REACT_SOURCES = [
    "https://unpkg.com/react@18/umd/react.production.min.js",
    "https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js",
  ];
  var REACT_DOM_SOURCES = [
    "https://unpkg.com/react-dom@18/umd/react-dom.production.min.js",
    "https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js",
  ];
  var BABEL_SOURCES = [
    "https://unpkg.com/@babel/standalone@7.25.6/babel.min.js",
    "https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js",
  ];

  loadWithFallback(REACT_SOURCES)
    .then(function () { return loadWithFallback(REACT_DOM_SOURCES); })
    .then(function () { return loadWithFallback(BABEL_SOURCES); })
    .then(function () {
      if (typeof React === "undefined" || typeof ReactDOM === "undefined" || typeof Babel === "undefined") {
        throw new Error(
          "React, ReactDOM o Babel no quedaron definidos tras la carga. " +
          "Puede que un bloqueador de anuncios o un firewall esté interceptando el script."
        );
      }
      var source = document.getElementById("app-source").textContent;
      var compiled = Babel.transform(source, {
        presets: [["react", { runtime: "classic" }]],
      }).code;
      var runner = document.createElement("script");
      runner.textContent = compiled;
      document.body.appendChild(runner);
    })
    .catch(function (err) {
      gremioShowFatalError(
        "No se pudieron cargar las librerías necesarias (React/ReactDOM/Babel) desde ninguna CDN.\n\n" +
        "Esto suele deberse a que no hay conexión a internet, o a que algo (firewall, proxy, extensión del navegador) está bloqueando unpkg.com y cdn.jsdelivr.net.\n\n" +
        "Detalle técnico:\n" + (err && err.message ? err.message : err)
      );
    });
})();
</script>
